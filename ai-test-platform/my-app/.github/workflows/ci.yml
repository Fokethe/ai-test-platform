name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: test-secret
          DATABASE_URL: file:./test.db

  epic7-smoke:
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: file:./test.db
      NEXTAUTH_SECRET: test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare test database
        run: npx prisma db push --skip-generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Epic 7 Smoke
        run: npm run test:e2e:epic7

  api-guards:
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: file:./test.db
      NEXTAUTH_SECRET: test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run API guard tests
        run: npm run test:api:guards
